
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- App Version: 1.1.2 - UI Sync Fix -->
    <title>HiSee Pro - لحظاتك، عالمك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,800;1,900&family=Noto+Kufi+Arabic:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0c10;
            --hisee-red: #f43f5e;
            --hisee-yellow: #facc15;
            --hisee-white: #ffffff;
            --hisee-emerald: #10b981;
            --guest-box-size: 80px;
        }
        /* Disable browser native menus and selection */
        body, button, input, div, img {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        
        /* Allow selection in input and textarea for usability if needed, 
           but the user request was broad. Usually we want to keep it enabled for inputs. 
           However, I'll follow the user's lead for now but might exclude inputs if it breaks typing. 
           Actually, inputs should usually allow selection. I will exclude input and textarea. */
        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        /* Prevent audio download controls */
        audio::-internal-media-controls-download-button {
            display: none !important;
        }
        audio::-webkit-media-controls-enclosure {
            overflow: hidden !important;
        }
        audio::-webkit-media-controls-panel {
            width: calc(100% + 30px) !important;
        }

        @keyframes ping-slow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0.2; }
            100% { transform: scale(2); opacity: 0; }
        }
        .animate-ping-slow {
            animation: ping-slow 3s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }

        body { 
            font-family: 'Noto Kufi Arabic', 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-main);
            color: #f8fafc;
            margin: 0; padding: 0;
            overflow: hidden; height: 100dvh; width: 100vw;
            /* Ensure the app is always interactive */
            pointer-events: auto !important;
            touch-action: manipulation;
        }

        /* Accessibility & Display Settings */
        html[data-font-size="small"] { font-size: 14px !important; }
        html[data-font-size="standard"] { font-size: 16px !important; }
        html[data-font-size="large"] { font-size: 18px !important; }
        html[data-font-size="huge"] { font-size: 20px !important; }

        /* Compact Mode: Reduce spacing on common utility classes */
        html.compact-mode [class*="p-"], html.compact-mode [class*="px-"], html.compact-mode [class*="py-"], html.compact-mode [class*="gap-"] {
            padding: 0.5em !important;
            gap: 0.25em !important;
        }

        html.high-contrast {
            filter: contrast(1.3) saturate(1.2);
        }
        html.high-contrast *:not(svg):not(path) {
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 0px 0px 4px #000 !important;
        }

        html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
            scroll-behavior: auto !important;
        }
        /* Force root to be interactive and on top */
        #root {
            position: relative;
            z-index: 1;
            pointer-events: auto !important;
        }
        .h-red { color: var(--hisee-red) !important; filter: drop-shadow(0 0 12px rgba(244,63,94,0.6)); }
        .i-white { color: var(--hisee-white) !important; }
        .hisee-logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.06em;
            text-transform: uppercase;
        }
        @keyframes spin-disc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes marquee-flow { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }
        @keyframes color-cycle {
            0% { color: var(--hisee-emerald); }
            25% { color: var(--hisee-white); }
            50% { color: var(--hisee-yellow); }
            75% { color: var(--hisee-red); }
            100% { color: var(--hisee-emerald); }
        }
        .animate-disc-spin { animation: spin-disc 5s linear infinite !important; }
        .hisee-custom-disc {
            background: conic-gradient(
                var(--hisee-emerald) 0deg 90deg, 
                var(--hisee-white) 90deg 180deg, 
                var(--hisee-yellow) 180deg 270deg, 
                var(--hisee-red) 270deg 360deg
            ) !important;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .marquee-text-hisee { 
            display: inline-block; 
            animation: marquee-flow 12s linear infinite, color-cycle 6s linear infinite !important;
            white-space: nowrap;
            font-weight: 900;
            font-style: italic;
        }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-container { scroll-snap-type: y mandatory; height: 100dvh; overflow-y: scroll; scroll-behavior: smooth; }
        .snap-item { scroll-snap-align: start; height: 100dvh; width: 100%; position: relative; }
        .custom-scrollbar-hidden::-webkit-scrollbar { display: none; }
        .custom-scrollbar-hidden { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Gradients & Animations */
        .text-hisee-gradient {
            background: linear-gradient(135deg, #f43f5e 0%, #facc15 35%, #10b981 65%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .bg-hisee-gradient {
            background: linear-gradient(135deg, #f43f5e 0%, #facc15 35%, #10b981 65%, #ffffff 100%);
            background-size: 200% 200%;
            animation: gradient-shift 5s ease infinite;
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 8s ease-in-out infinite;
        }

        /* Pulse for icons */
        .pulse-emerald { animation: pulse-emerald 2s infinite; }
        @keyframes pulse-emerald {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes wave-bg {
            0% { background-position-x: 0; }
            100% { background-position-x: 400px; }
        }

        @keyframes wave-bg-reverse {
            0% { background-position-x: 400px; }
            100% { background-position-x: 0; }
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce-subtle {
            animation: bounce-subtle 2s ease-in-out infinite;
        }
        @keyframes pk-attack-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(250, 204, 21, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 35px rgba(250, 204, 21, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.5); transform: scale(1.05); }
        }
        .animate-pk-attack {
            animation: pk-attack-glow 1.5s ease-in-out infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .animate-scan {
            animation: scan 2s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(0.9); opacity: 0; }
            50% { opacity: 1; transform: translateY(-50vh) scale(1.1); }
            100% { transform: translateY(-100vh) scale(0.9); opacity: 0; }
        }
        .animate-float {
            animation: float linear infinite;
        }

        @keyframes snow {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .animate-snow {
            animation: snow linear infinite;
        }
        /* Fix comments overlapping guest stream windows on mobile screens */
        @media (max-width: 600px) {
          .guest-stream-container { 
            display: flex !important;
            flex-direction: column !important;
            max-height: 50vh !important; /* تقييد ارتفاع النوافذ المشتركة للنصف */
          }
          body:has(.guest-stream-container) .chat-container {
            flex: 1 !important;
            overflow-y: auto !important;
          }
        }
    </style>
    <script>
        window.addEventListener('error', function(event) {
            console.warn('Global error captured safely:', event?.message || event);
        });
        window.addEventListener('unhandledrejection', function(event) {
            console.warn('Unhandled promise rejection captured safely:', event?.reason);
        });
    </script>
</head>
<body>
    <div id="root" class="h-full w-full">
        <div style="min-height: 100dvh; width: 100%; background-color: #0a0c10; display: flex; align-items: center; justify-content: center;">
            <div style="width: 48px; height: 48px; border: 4px solid #f43f5e; border-top-color: transparent; border-radius: 50%; animation: spin-disc 1s linear infinite;"></div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
